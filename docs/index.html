<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rocket Crown Casino</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand-block">
        <div class="brand-title">ROCKET</div>
        <div class="brand-subtitle">CROWN</div>
      </div>
      <div class="top-actions">
        <div id="balanceLabel" class="balance-pill">$0.00</div>
        <button class="menu-button" id="menuButton" aria-label="Открыть меню">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <div class="menu-panel" id="menuPanel">
      <a href="admin/">Admin Panel</a>
      <a href="#" id="menuLogout">Logout</a>
      <a href="mailto:support@rocketcrown.com">Email</a>
      <a href="#">Referral Program</a>
    </div>

    <main class="content">
      <section class="screen active" id="homeScreen">
        <div class="hero-card">
          <p class="eyebrow">WELCOME BONUS</p>
          <h1>200% + 250 FREE SPINS</h1>
          <button id="claimBonusBtn">Claim Bonus</button>
        </div>

        <div class="quick-stats">
          <div class="stat-pill" id="statGames">Games online</div>
          <div class="stat-pill" id="statUsers">Active users</div>
          <div class="stat-pill" id="statDeposits">Deposits enabled</div>
        </div>

        <div class="section-title-row">
          <h2>Popular Games</h2>
          <span>Tap to play</span>
        </div>
        <div id="gamesCarousel" class="games-carousel"></div>

        <div class="section-title-row">
          <h2>Active Promotions</h2>
        </div>
        <div id="promoList" class="promo-list"></div>

        <div class="section-title-row">
          <h2>Live Wins</h2>
        </div>
        <ul id="liveWinsList" class="live-wins-list"></ul>
      </section>

      <section class="screen" id="casinoScreen">
        <div class="section-title-row">
          <h2>Casino</h2>
          <span>Fair random results</span>
        </div>
        <div id="casinoGrid" class="casino-stack"></div>
      </section>

      <section class="screen" id="walletScreen">
        <div class="wallet-card">
          <p class="eyebrow">Wallet</p>
          <h1 id="walletBalance">$0.00</h1>
          <div class="wallet-actions">
            <form id="depositForm" class="action-form">
              <input type="number" id="depositAmount" min="10" step="10" placeholder="Deposit amount" required />
              <select id="depositMethod">
                <option value="TON">TON</option>
                <option value="USDT">USDT</option>
                <option value="SOL">SOL</option>
              </select>
              <button type="submit">Request Deposit</button>
            </form>
            <form id="withdrawForm" class="action-form">
              <input type="number" id="withdrawAmount" min="10" step="10" placeholder="Withdraw amount" required />
              <input type="text" id="withdrawAddress" placeholder="TON / USDT address" required />
              <button type="submit">Request Withdraw</button>
            </form>
          </div>
        </div>

        <div class="info-card">
          <h3>Pending requests</h3>
          <div id="walletRequests"></div>
        </div>
      </section>

      <section class="screen" id="profileScreen">
        <div id="authPanel" class="profile-card"></div>
        <div id="profilePanel" class="profile-card"></div>
        <div id="settingsPanel" class="profile-card"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-screen="home">Home</button>
      <button class="nav-btn" data-screen="casino">Casino</button>
      <button class="nav-btn" data-screen="wallet">Wallet</button>
      <button class="nav-btn" data-screen="profile">Profile</button>
    </nav>
  </div>

  <div class="modal" id="gameModal" hidden></div>

  <script src="script.js"></script>
</body>
</html>
