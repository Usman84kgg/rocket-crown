<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors https://web.telegram.org" />

<title>Rocket Wallet</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="wallet-container">

    <!-- HEADER -->

    <div class="wallet-header">

        <h1>Кошелек</h1>

        <div class="wallet-tabs">

            <div class="active-tab">
                Депозит
            </div>

            <div>
                Вывод
            </div>

            <div>
                История
            </div>

        </div>

    </div>


    <!-- BONUS -->

    <div class="wallet-banner">

        Бонус до 425% на пополнение
        <br>
        +250 Free Spins

    </div>


    <!-- REGION -->

    <div class="wallet-region">

        <div>
            Регион оплаты
        </div>

        <div>
            USD $
        </div>

    </div>


    <!-- CRYPTO -->

    <h2>Криптовалюта</h2>

    <div class="crypto-grid">

        <div class="crypto-card">
            TON
            <span>+7%</span>
        </div>

        <div class="crypto-card">
            USDT (TON)
            <span>+7%</span>
        </div>

        <div class="crypto-card">
            USDT (TRC20)
            <span>+5%</span>
        </div>

        <div class="crypto-card">
            USDT (BEP20)
            <span>+5%</span>
        </div>

        <div class="crypto-card">
            TRX
            <span>+5%</span>
        </div>

        <div class="crypto-card">
            ETH
            <span>+5%</span>
        </div>

        <div class="crypto-card">
            BTC
            <span>+5%</span>
        </div>

        <div class="crypto-card">
            SOL
            <span>+5%</span>
        </div>

        <div class="crypto-card">
            BNB
            <span>+5%</span>
        </div>

        <div class="crypto-card">
            DOGE
            <span>+5%</span>
        </div>

        <div class="crypto-card">
            XRP
            <span>+5%</span>
        </div>

        <div class="crypto-card">
            LTC
            <span>+5%</span>
        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
